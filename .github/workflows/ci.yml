name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: make check
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-logs
          path: .agent/
          include-hidden-files: true
          retention-days: 7
